<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英単語トレーニング（英検2級レベル・レベル制）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background: #f4f6fb; color: #222; padding: 16px; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 8px 0 4px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 16px; }
  .card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  button { font-size: 16px; border: none; border-radius: 10px; padding: 12px 18px; cursor: pointer; background: #3b6fe0; color: #fff; width: 100%; margin-top: 10px; }
  button:disabled { background: #b9c4d6; cursor: not-allowed; }
  button.sub-btn { background: #eef2fa; color: #3b6fe0; }
  button.learned { background: #2ea44f; }
  button.not-yet { background: #eef2fa; color: #555; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 6px; border-bottom: 1px solid #eee; text-align: left; vertical-align: middle; }
  th { font-size: 12px; color: #888; }
  .en { font-size: 18px; font-weight: 600; }
  .ja { font-size: 15px; color: #444; }
  td .mini { width: auto; padding: 8px 12px; font-size: 14px; margin: 0; white-space: nowrap; }
  .choice { display: block; width: 100%; text-align: left; background: #eef2fa; color: #222; margin-top: 8px; }
  .choice.correct { background: #2ea44f; color: #fff; }
  .choice.wrong { background: #e0533b; color: #fff; }
  .q { font-size: 22px; font-weight: 700; margin: 10px 0 4px; }
  .q-label { font-size: 12px; color: #888; }
  .progress { font-size: 13px; color: #666; margin-bottom: 6px; }
  .set-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px; border-bottom: 1px solid #eee; }
  .set-row:last-child { border-bottom: none; }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: #eef2fa; color: #3b6fe0; white-space: nowrap; }
  .badge.done { background: #e2f4e8; color: #2ea44f; }
  .badge.review { background: #fff3d6; color: #a86e00; }
  .set-row button { width: auto; margin: 0; padding: 8px 14px; font-size: 14px; }
  .big-score { font-size: 34px; font-weight: 800; text-align: center; margin: 8px 0; }
  .note { font-size: 13px; color: #666; line-height: 1.6; }
  .hidden { display: none; }
  .level-head { font-size: 15px; font-weight: 700; color: #3b6fe0; margin: 16px 0 4px; }
  .level-head:first-child { margin-top: 4px; }
  textarea { width: 100%; margin-top: 10px; padding: 10px; border: 1px solid #ccd3e0; border-radius: 10px; font-size: 12px; font-family: monospace; }

</head>
<body>
<h1>英単語トレーニング</h1>
<p class="sub">英検2級レベル ・ レベル1〜6 ・ 単語1320語 ＋ 熟語300個</p>

<!-- ホーム -->
<div id="view-home">
  <div class="card" id="placement-card">
    <p><strong>最初にレベル診断</strong></p>
    <p class="note">20問のテストで、今どのくらい分かるかを測って、始めるセットを決めるよ。</p>
    <button onclick="startPlacement()">レベル診断を受ける</button>
  </div>
  <div class="card" id="missed-card" style="display:none">
    <p><strong>苦手な単語の復習</strong></p>
    <p class="note" id="missed-count"></p>
    <button onclick="startMissedReview()">苦手な単語だけテストする</button>
  </div>
  <div class="card">
    <p><strong>レベルを選ぶ</strong></p>
    <p class="note">レベルごとにページが分かれているよ。選ぶと、そのレベルのセット一覧が開くよ。</p>
    <div id="level-cards"></div>
  </div>
  <div class="card">
    <p><strong>進み具合のバックアップ</strong></p>
    <p class="note">進み具合は開いたブラウザの中にだけ保存されるよ。別のブラウザ・端末で続きをやるときは、コードをコピーして移してね。</p>
    <button class="sub-btn" onclick="exportState()">進み具合をコードで保存</button>
    <div id="export-area" class="hidden">
      <textarea id="export-text" readonly rows="4"></textarea>
      <button onclick="copyExport()">コードをコピー</button>
    </div>
    <textarea id="import-text" rows="4" placeholder="ここにコードを貼り付け"></textarea>
    <button class="sub-btn" onclick="importState()">コードから復元</button>
  </div>
  <div class="card">
    <button class="sub-btn" onclick="resetAll()">進み具合をリセット</button>
  </div>
</div>

<!-- レベル別ページ -->
<div id="view-level" class="hidden">
  <div class="card">
    <p><strong id="level-page-title"></strong></p>
    <p class="note" id="level-page-note"></p>
    <div id="level-set-list"></div>
    <button class="sub-btn" onclick="goHome()">ホームに戻る</button>
  </div>
</div>

<!-- 学習（単語表） -->
<div id="view-study" class="hidden">
  <div class="card">
    <p class="progress" id="study-title"></p>
    <table>
      <tr><th>英語</th><th>日本語</th><th></th></tr>
      <tbody id="word-table"></tbody>
    </table>
    <button id="to-test-btn" onclick="startTest()" disabled>テストをする</button>
    <button class="sub-btn" onclick="backFromStudy()">セット一覧に戻る</button>
  </div>
</div>

<!-- 学習（熟語表） -->
<div id="view-idiom-study" class="hidden">
  <div class="card">
    <p class="progress" id="idiom-study-title"></p>
    <table>
      <tr><th>熟語</th><th>日本語</th><th></th></tr>
      <tbody id="idiom-table"></tbody>
    </table>
    <button id="idiom-to-test-btn" onclick="startIdiomTest()" disabled>テストをする</button>
    <button class="sub-btn" onclick="backFromIdiomStudy()">セット一覧に戻る</button>
  </div>
</div>

<!-- テスト -->
<div id="view-quiz" class="hidden">
  <div class="card">
    <p class="progress" id="quiz-progress"></p>
    <p class="q-label" id="quiz-label"></p>
    <p class="q" id="quiz-q"></p>
    <div id="quiz-choices"></div>
    <button id="quiz-next" class="hidden" onclick="nextQuestion()">次へ</button>
  </div>
</div>

<!-- 結果 -->
<div id="view-result" class="hidden">
  <div class="card">
    <p style="text-align:center" id="result-title">結果</p>
    <p class="big-score" id="result-score"></p>
    <p class="note" id="result-detail" style="text-align:center"></p>
    <button onclick="backFromResult()">一覧に戻る</button>
  </div>
</div>

const LEVELS = [
  { name: "レベル1", start: 0, count: 20 },
  { name: "レベル2", start: 20, count: 30 },
  { name: "レベル3", start: 50, count: 30 },
  { name: "レベル4", start: 80, count: 30 },
  { name: "レベル5", start: 110, count: 12 },
  { name: "レベル6", start: 122, count: 10 }
];
function levelOf(i) {
  for (const L of LEVELS) if (i >= L.start && i < L.start + L.count) return L;
  return LEVELS[0];
}
function setLabel(i) {
  const L = levelOf(i);
  return `${L.name} セット${i - L.start + 1}`;
}

const KEY = "eiken_vocab_v1";
let state = JSON.parse(localStorage.getItem(KEY) || "{}");
if (!state.learned) state = { learned: {}, cleared: {}, placementDone: false, startSet: 0 };
if (!state.missed) state.missed = {}; // 苦手プール { "英単語" or "i:熟語": { m: 間違えた回数, s: 連続正解数 } }
if (!state.idiomLearned) state.idiomLearned = {}; // 熟語の「覚えた」 { セットindex: { 項目index: true } }
if (!state.idiomCleared) state.idiomCleared = {}; // 熟語セットのクリア { セットindex: true }
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

let currentSet = 0;

function show(id) {
  ["view-home","view-level","view-study","view-idiom-study","view-quiz","view-result"].forEach(v => document.getElementById(v).classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  window.scrollTo(0,0);
}
function goHome() { renderHome(); show("view-home"); }

function setStatus(i) {
  if (state.cleared[i]) return "done";
  if (i < state.startSet) return "skip";
  return "";
}
function renderHome() {
  document.getElementById("placement-card").style.display = state.placementDone ? "none" : "block";
  const missedCount = Object.keys(state.missed || {}).length;
  document.getElementById("missed-card").style.display = missedCount ? "block" : "none";
  if (missedCount) document.getElementById("missed-count").textContent = `テストで間違えた単語・熟語が ${missedCount} 件たまっているよ。各セットのテストにも多めに出てくるし、ここからまとめて復習もできるよ（2回連続で正解すると卒業）。`;
  renderLevelCards();
}

// ホームの「レベルを選ぶ」カード群（各レベルの進み具合つき）
function renderLevelCards() {
  const box = document.getElementById("level-cards");
  box.innerHTML = "";
  LEVELS.forEach((L, li) => {
    const doneCount = SETS.slice(L.start, L.start + L.count).filter((_, k) => state.cleared[L.start + k]).length;
    const row = document.createElement("div");
    row.className = "set-row";
    row.innerHTML = `<span><strong>${L.name}</strong> <span class="badge ${doneCount === L.count ? "done" : ""}">${doneCount} / ${L.count} セット クリア</span></span>`;
    const btn = document.createElement("button");
    btn.textContent = "開く";
    btn.onclick = () => openLevelPage(li);
    row.appendChild(btn);
    box.appendChild(row);
  });
  const idone = IDIOM_SETS.filter((_, k) => state.idiomCleared[k]).length;
  const row = document.createElement("div");
  row.className = "set-row";
  row.innerHTML = `<span><strong>熟語（イディオム）</strong> <span class="badge ${idone === IDIOM_SETS.length ? "done" : ""}">${idone} / ${IDIOM_SETS.length} セット クリア</span></span>`;
  const btn = document.createElement("button");
  btn.textContent = "開く";
  btn.onclick = () => openIdiomPage();
  row.appendChild(btn);
  box.appendChild(row);
}

// レベル別ページ（単語）：そのレベルのセット一覧だけを表示
let currentPage = null; // { type: "level", level: index } or { type: "idiom" }
function openLevelPage(li) {
  currentPage = { type: "level", level: li };
  const L = LEVELS[li];
  const doneCount = SETS.slice(L.start, L.start + L.count).filter((_, k) => state.cleared[L.start + k]).length;
  document.getElementById("level-page-title").textContent = `${L.name}（${doneCount} / ${L.count} セット クリア）`;
  document.getElementById("level-page-note").innerHTML = "単語表で覚える → 「覚えた」を押す → テスト。テストには<strong>前回のセット</strong>と<strong>5回前のセット</strong>の復習に加えて、<strong>間違えた単語（苦手な単語）</strong>も多めに混ざるよ。";
  const list = document.getElementById("level-set-list");
  list.innerHTML = "";
  for (let k = 0; k < L.count; k++) {
    const i = L.start + k;
    const row = document.createElement("div");
    row.className = "set-row";
    let badge = "";
    if (state.cleared[i]) badge = '<span class="badge done">クリア済み</span>';
    else if (i < state.startSet) badge = '<span class="badge">診断でスキップ可</span>';
    row.innerHTML = `<span>セット ${k + 1} ${badge}</span>`;
    const btn = document.createElement("button");
    btn.textContent = state.cleared[i] ? "見直す" : "覚える";
    btn.onclick = () => openStudy(i);
    row.appendChild(btn);
    list.appendChild(row);
  }
  show("view-level");
}

  const idone = IDIOM_SETS.filter((_, k) => state.idiomCleared[k]).length;
  document.getElementById("level-page-title").textContent = `熟語（イディオム）（${idone} / ${IDIOM_SETS.length} セット クリア）`;
  document.getElementById("level-page-note").innerHTML = "共通テスト・大学入試でよく出る熟語・句動詞が300個（30セット × 10個）。単語と同じ流れだよ：熟語表で覚える → 「覚えた」を押す → テスト。間違えた熟語は<strong>苦手リスト</strong>に入って、復習で出てくるよ。";
  const list = document.getElementById("level-set-list");
  list.innerHTML = "";
  IDIOM_SETS.forEach((s, k) => {
    const row = document.createElement("div");
    row.className = "set-row";
    const badge = state.idiomCleared[k] ? ' <span class="badge done">クリア済み</span>' : "";
    row.innerHTML = `<span>熟語セット ${k + 1}${badge}</span>`;
    const btn = document.createElement("button");
    btn.textContent = state.idiomCleared[k] ? "見直す" : "覚える";
    btn.onclick = () => openIdiomStudy(k);
    row.appendChild(btn);
    list.appendChild(row);
  });
  show("view-level");
}

// 学習・結果画面からの戻り先：該当レベルのページへ（診断・苦手復習の結果からはホームへ）
function backFromStudy() { openLevelPage(LEVELS.indexOf(levelOf(currentSet))); }
function backFromIdiomStudy() { openIdiomPage(); }
function backFromResult() {
  if (quizMode === "set") openLevelPage(LEVELS.indexOf(levelOf(currentSet)));
  else if (quizMode === "idiom") openIdiomPage();
  else goHome();
}

function openStudy(i) {
  currentSet = i;
  document.getElementById("study-title").textContent = `${setLabel(i)}（10語）`;
  const tb = document.getElementById("word-table");
  tb.innerHTML = "";
  SETS[i].forEach((w, j) => {
    const tr = document.createElement("tr");
    const learned = state.learned[i] && state.learned[i][j];
    tr.innerHTML = `<td class="en">${w[0]}</td><td class="ja">${w[1]}</td>`;
    const td = document.createElement("td");
    const b = document.createElement("button");
    b.className = "mini " + (learned ? "learned" : "not-yet");
    b.textContent = learned ? "覚えた ✓" : "覚えた";
    b.onclick = () => {
      if (!state.learned[i]) state.learned[i] = {};
      state.learned[i][j] = !state.learned[i][j];
      save(); openStudy(i);
    };
    td.appendChild(b); tr.appendChild(td); tb.appendChild(tr);
  });
  const all = SETS[i].every((_, j) => state.learned[i] && state.learned[i][j]);
  const btn = document.getElementById("to-test-btn");
  btn.disabled = !all;
  btn.textContent = all ? "テストをする" : "全部「覚えた」を押すとテストできるよ";
  show("view-study");
}

let currentIdiomSet = 0;
function openIdiomStudy(i) {
  currentIdiomSet = i;
  document.getElementById("idiom-study-title").textContent = `熟語セット${i + 1}（10個）`;
  const tb = document.getElementById("idiom-table");
  tb.innerHTML = "";
  IDIOM_SETS[i].forEach((w, j) => {
    const tr = document.createElement("tr");
    const learned = state.idiomLearned[i] && state.idiomLearned[i][j];
    tr.innerHTML = `<td class="en">${w[0]}</td><td class="ja">${w[1]}</td>`;
    const td = document.createElement("td");
    const b = document.createElement("button");
    b.className = "mini " + (learned ? "learned" : "not-yet");
    b.textContent = learned ? "覚えた ✓" : "覚えた";
    b.onclick = () => {
      if (!state.idiomLearned[i]) state.idiomLearned[i] = {};
      state.idiomLearned[i][j] = !state.idiomLearned[i][j];
      save(); openIdiomStudy(i);
    };
    td.appendChild(b); tr.appendChild(td); tb.appendChild(tr);
  });
  const all = IDIOM_SETS[i].every((_, j) => state.idiomLearned[i] && state.idiomLearned[i][j]);
  const btn = document.getElementById("idiom-to-test-btn");
  btn.disabled = !all;
  btn.textContent = all ? "テストをする" : "全部「覚えた」を押すとテストできるよ";
  show("view-idiom-study");
}

function startIdiomTest() {
  const i = currentIdiomSet;
  quiz = [];
  IDIOM_SETS[i].forEach(w => quiz.push(makeQ(w, "今回の熟語セット", ALL_IDIOMS, "i:")));
  // 苦手な熟語を混ぜる（今回のセットと重複しないもの、間違えた回数が多い順の上位から最大5問）
  const inQuiz = new Set(quiz.map(q => q.w[0]));
  const pool = ALL_IDIOMS.filter(w => state.missed[idiomKey(w)] && !inQuiz.has(w[0]));
  pool.sort((a, b) => (state.missed[idiomKey(b)].m || 0) - (state.missed[idiomKey(a)].m || 0));
  sample(pool.slice(0, 10), 5).forEach(w => quiz.push(makeQ(w, "苦手な単語の復習", ALL_IDIOMS, "i:")));
  quiz = shuffle(quiz);
  quizMode = "idiom"; quizIdx = 0; quizScore = {};
  show("view-quiz"); renderQ();
}

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function sample(a, n) { return shuffle(a).slice(0, n); }

function makeQ(wordPair, tag, allWords, keyPrefix) {
  const enToJa = Math.random() < 0.6;
  const others = sample(allWords.filter(w => w !== wordPair), 3);
  const key = (keyPrefix || "") + wordPair[0]; // 苦手プール用キー（熟語は "i:" 接頭辞付き）
  if (enToJa) {
    return { tag, w: wordPair, key, q: wordPair[0], label: "意味はどれ？", choices: shuffle([wordPair[1], ...others.map(w => w[1])]), answer: wordPair[1] };
  }
  return { tag, w: wordPair, key, q: wordPair[1], label: "英語ではどれ？", choices: shuffle([wordPair[0], ...others.map(w => w[0])]), answer: wordPair[0] };
}

const ALL = SETS.flat();

// 単語の差し替え等でデータに無くなった単語・熟語が苦手プールに残っていたら掃除する
// （出題は常にデータ基準でフィルタされるので壊れないが、件数表示を正しく保つため）
function pruneMissed() {
  if (!state.missed) return;
  const valid = new Set(ALL.map(w => w[0]));
  ALL_IDIOMS.forEach(w => valid.add(idiomKey(w)));
  let changed = false;
  Object.keys(state.missed).forEach(k => { if (!valid.has(k)) { delete state.missed[k]; changed = true; } });
  if (changed) save();
}
pruneMissed();

// 回答を苦手プールに反映：間違えたら登録（連続正解リセット）、正解したら連続正解+1、2回連続で卒業
function recordAnswer(q, ok) {
  if (!q || !q.w) return;
  const en = q.key || q.w[0];
  const m = state.missed[en];
  if (ok) {
    if (m) { m.s = (m.s || 0) + 1; if (m.s >= 2) delete state.missed[en]; }
  } else {
    if (m) { m.m = (m.m || 0) + 1; m.s = 0; }
    else state.missed[en] = { m: 1, s: 0 };
  }
  save();
}

function startTest() {
  const i = currentSet;
  quiz = [];
  SETS[i].forEach(w => quiz.push(makeQ(w, "今回のセット", ALL)));
  if (i >= 1 && (state.cleared[i-1] || i-1 < state.startSet)) sample(SETS[i-1], 5).forEach(w => quiz.push(makeQ(w, "前回の復習", ALL)));
  if (i >= 5 && (state.cleared[i-5] || i-5 < state.startSet)) sample(SETS[i-5], 5).forEach(w => quiz.push(makeQ(w, "5回前の復習", ALL)));
  // 苦手な単語を多めに混ぜる（今回のセットと重複しないもの、間違えた回数が多い順の上位から最大7問）
  const inQuiz = new Set(quiz.map(q => q.w[0]));
  const pool = ALL.filter(w => state.missed[w[0]] && !inQuiz.has(w[0]));
  pool.sort((a, b) => (state.missed[b[0]].m || 0) - (state.missed[a[0]].m || 0));
  sample(pool.slice(0, 14), 7).forEach(w => quiz.push(makeQ(w, "苦手な単語の復習", ALL)));
  quiz = shuffle(quiz);
  quizMode = "set"; quizIdx = 0; quizScore = {};
  show("view-quiz"); renderQ();
}

function startPlacement() {
  // レベル1〜4から5問ずつ（計20問）サンプリングし、レベル別に集計する
  quiz = [];
  LEVELS.slice(0, 4).forEach((L, li) => {
    sample(SETS.slice(L.start, L.start + L.count), 5).forEach(s => {
      const w = s[Math.floor(Math.random() * 10)];
      const q = makeQ(w, "診断" + (li + 1), ALL);
      q.label = "意味はどれ？"; q.q = w[0];
      q.choices = shuffle([w[1], ...sample(ALL.filter(x => x !== w), 3).map(x => x[1])]);
      q.answer = w[1];
      quiz.push(q);
    });
  });
  quiz = shuffle(quiz);
  quizMode = "placement"; quizIdx = 0; quizScore = {};
  show("view-quiz"); renderQ();
}

function startMissedReview() {
  const pool = ALL.filter(w => state.missed[w[0]]);
  const ipool = ALL_IDIOMS.filter(w => state.missed[idiomKey(w)]);
  if (!pool.length && !ipool.length) return;
  quiz = [];
  sample(pool, 7).forEach(w => quiz.push(makeQ(w, "苦手な単語の復習", ALL)));
  sample(ipool, 5).forEach(w => quiz.push(makeQ(w, "苦手な単語の復習", ALL_IDIOMS, "i:")));
  quiz = shuffle(quiz).slice(0, 12);
  quizMode = "review"; quizIdx = 0; quizScore = {};
  show("view-quiz"); renderQ();
}

function renderQ() {
  const q = quiz[quizIdx];
  quizAnswered = false;
  document.getElementById("quiz-progress").textContent = `${quizIdx + 1} / ${quiz.length} 問`;
  document.getElementById("quiz-label").textContent = q.tag + " ・ " + q.label;
  document.getElementById("quiz-q").textContent = q.q;
  const box = document.getElementById("quiz-choices");
  box.innerHTML = "";
  q.choices.forEach(c => {
    const b = document.createElement("button");
    b.className = "choice"; b.textContent = c;
    b.onclick = () => {
      if (quizAnswered) return;
      quizAnswered = true;
      const ok = c === q.answer;
      if (!quizScore[q.tag]) quizScore[q.tag] = { ok: 0, total: 0 };
      quizScore[q.tag].total++; if (ok) quizScore[q.tag].ok++;
      recordAnswer(q, ok);
      b.classList.add(ok ? "correct" : "wrong");
      [...box.children].forEach(x => { if (x.textContent === q.answer) x.classList.add("correct"); x.disabled = true; });
      document.getElementById("quiz-next").classList.remove("hidden");
      document.getElementById("quiz-next").textContent = quizIdx + 1 < quiz.length ? "次へ" : "結果を見る";
    };
    box.appendChild(b);
  });
  document.getElementById("quiz-next").classList.add("hidden");
}

function nextQuestion() {
  quizIdx++;
  if (quizIdx < quiz.length) { renderQ(); return; }
  finishQuiz();
}

function finishQuiz() {
  show("view-result");
  if (quizMode === "placement") {
    const g = n => (quizScore["診断" + n] || { ok: 0, total: 5 }).ok;
    const total = g(1) + g(2) + g(3) + g(4);
    document.getElementById("result-title").textContent = "レベル診断の結果";
    document.getElementById("result-score").textContent = `${total} / 20`;
    let start = 0, msg = "";
    if (g(1) >= 4 && g(2) >= 4 && g(3) >= 4 && g(4) >= 3) { start = 80; msg = "すごい！レベル4から始められる力があるよ。"; }
    else if (g(1) >= 4 && g(2) >= 4 && g(3) >= 3) { start = 50; msg = "すごい！レベル3から始められる力があるよ。"; }
    else if (g(1) >= 4 && g(2) >= 3) { start = 20; msg = "基礎はしっかりしてる。レベル2から始めよう。"; }
    else if (g(1) >= 4) { start = 10; msg = "レベル1の後半（セット11）から始めよう。"; }
    else if (g(1) >= 2) { start = 4; msg = "レベル1のセット5から始めよう。"; }
    else { start = 0; msg = "まずはレベル1のセット1から、土台を固めよう。"; }
    state.placementDone = true; state.startSet = start; save();
    document.getElementById("result-detail").textContent = msg + "（間違えた単語は苦手リストに入って、復習で出てくるよ）";
  } else if (quizMode === "review") {
    const r = quizScore["苦手な単語の復習"] || { ok: 0, total: 0 };
    document.getElementById("result-title").textContent = "苦手な単語の復習テスト";
    document.getElementById("result-score").textContent = `${r.ok} / ${r.total}`;
    const left = Object.keys(state.missed).length;
    document.getElementById("result-detail").textContent = left ? `残りの苦手な単語・熟語は ${left} 件。2回連続で正解すると卒業だよ。` : "苦手な単語・熟語は全部卒業！すごい 🎉";
  } else if (quizMode === "idiom") {
    const main = quizScore["今回の熟語セット"] || { ok: 0, total: 10 };
    const pct = Math.round(main.ok / main.total * 100);
    document.getElementById("result-title").textContent = `熟語セット${currentIdiomSet + 1} の結果`;
    document.getElementById("result-score").textContent = `${pct}%`;
    let detail = `今回の熟語セット： ${main.ok} / ${main.total}`;
    if (quizScore["苦手な単語の復習"]) detail += ` ・ 苦手な熟語： ${quizScore["苦手な単語の復習"].ok} / ${quizScore["苦手な単語の復習"].total}`;
    if (pct >= 80) { state.idiomCleared[currentIdiomSet] = true; save(); detail += "\nクリア！次の熟語セットに進めるよ 🎉"; }
    else detail += "\nクリアは80%から。間違えた熟語だけ見直してもう一度やってみよう。";
    document.getElementById("result-detail").textContent = detail;
  } else {
    const main = quizScore["今回のセット"] || { ok: 0, total: 10 };
    const pct = Math.round(main.ok / main.total * 100);
    document.getElementById("result-title").textContent = `${setLabel(currentSet)} の結果`;
    document.getElementById("result-score").textContent = `${pct}%`;
    let detail = `今回のセット： ${main.ok} / ${main.total}`;
    if (quizScore["前回の復習"]) detail += ` ・ 前回の復習： ${quizScore["前回の復習"].ok} / ${quizScore["前回の復習"].total}`;
    if (quizScore["5回前の復習"]) detail += ` ・ 5回前の復習： ${quizScore["5回前の復習"].ok} / ${quizScore["5回前の復習"].total}`;
    if (quizScore["苦手な単語の復習"]) detail += ` ・ 苦手な単語： ${quizScore["苦手な単語の復習"].ok} / ${quizScore["苦手な単語の復習"].total}`;
    if (pct >= 80) { state.cleared[currentSet] = true; save(); detail += "\nクリア！次のセットに進めるよ 🎉"; }
    else detail += "\nクリアは80%から。間違えた単語だけ見直してもう一度やってみよう。";
    document.getElementById("result-detail").textContent = detail;
  }
}

// 進み具合のエクスポート/インポート（Base64化したJSONコードで受け渡し）
function exportState() {
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(state))));
  document.getElementById("export-area").classList.remove("hidden");
  document.getElementById("export-text").value = code;
}
function copyExport() {
  const t = document.getElementById("export-text");
  t.select();
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).catch(() => document.execCommand("copy"));
  else document.execCommand("copy");
}
function importState() {
  const code = document.getElementById("import-text").value.trim();
  if (!code) { alert("コードを貼り付けてね"); return; }
  try {
    const obj = JSON.parse(decodeURIComponent(escape(atob(code))));
    if (!obj || typeof obj !== "object" || !obj.learned || !obj.cleared) throw new Error("invalid");
    state = obj;
    if (!state.missed) state.missed = {};
    if (!state.idiomLearned) state.idiomLearned = {};
    if (!state.idiomCleared) state.idiomCleared = {};
    if (typeof state.startSet !== "number") state.startSet = 0;
    if (typeof state.placementDone !== "boolean") state.placementDone = false;
    pruneMissed();
    save(); renderHome();
    document.getElementById("import-text").value = "";
    alert("進み具合を復元したよ！");
  } catch (e) {
    alert("コードが読み取れなかったよ。コード全部がコピーできているか確認してね。");
  }
}

function resetAll() {
  if (!confirm("進み具合を全部消す？")) return;
  localStorage.removeItem(KEY);
  state = { learned: {}, cleared: {}, placementDone: false, startSet: 0, missed: {}, idiomLearned: {}, idiomCleared: {} };
  renderHome();
}

renderHome();
</script>
